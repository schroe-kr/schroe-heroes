<text class="ja-summary" x="148" y="543" fill="#2A3346" font-size="30" font-weight="400" text-anchor="start">を選んでみてください。</text>
  <rect data-row-key="love" x="72" y="602" width="936" height="156" rx="14" fill="#ffffff" fill-opacity="0.66" stroke="#20293B" stroke-opacity="0.09" stroke-width="2" filter="url(#panelShadow)"/><text class="ja-sans" data-role="detail-heading" data-row-key="love" x="112" y="638" fill="#C0637A" font-size="18" font-weight="800" text-anchor="start">💗 恋愛 3/5</text><foreignObject data-role="detail-copy" x="112" y="648" width="856" height="100"><div xmlns="http://www.w3.org/1999/xhtml" class="ja-sans" style="width:100%;height:100%;display:flex;align-items:center;color:#303948;font-family:&#39;Hiragino Sans&#39;, &#39;Hiragino Kaku Gothic ProN&#39;, &#39;Yu Gothic&#39;, &#39;Noto Sans CJK JP&#39;, &#39;Noto Sans JP&#39;, sans-serif;font-size:23px;font-weight:450;line-height:33px;letter-spacing:0;white-space:normal;line-break:strict;word-break:normal;overflow-wrap:normal;overflow:hidden;">相手の交友関係と自分を比べると、距離感を見失いやすい日です。二人で落ち着いて過ごせる場所を一つ選んで提案してみてください。</div></foreignObject><rect data-row-key="money" x="72" y="778" width="936" height="156" rx="14" fill="#ffffff" fill-opacity="0.66" stroke="#20293B" stroke-opacity="0.09" stroke-width="2" filter="url(#panelShadow)"/><text class="ja-sans" data-role="detail-heading" data-row-key="money" x="112" y="814" fill="#B08A3C" font-size="18" font-weight="800" text-anchor="start">💰 金運 4/5</text><foreignObject data-role="detail-copy" x="112" y="824" width="856" height="100"><div xmlns="http://www.w3.org/1999/xhtml" class="ja-sans" style="width:100%;height:100%;display:flex;align-items:center;color:#303948;font-family:&#39;Hiragino Sans&#39;, &#39;Hiragino Kaku Gothic ProN&#39;, &#39;Yu Gothic&#39;, &#39;Noto Sans CJK JP&#39;, &#39;Noto Sans JP&#39;, sans-serif;font-size:23px;font-weight:450;line-height:33px;letter-spacing:0;white-space:normal;line-break:strict;word-break:normal;overflow-wrap:normal;overflow:hidden;">周囲の購入品が気になっても、同じものが必要とは限りません。今月使う予定を確認し、長く使える品を価格比較してみてください。</div></foreignObject><rect data-row-key="career" x="72" y="954" width="936" height="156" rx="14" fill="#ffffff" fill-opacity="0.66" stroke="#20293B" stroke-opacity="0.09" stroke-width="2" filter="url(#panelShadow)"/><text class="ja-sans" data-role="detail-heading" data-row-key="career" x="112" y="990" fill="#4C7A9E" font-size="18" font-weight="800" text-anchor="start">💼 仕事 3/5</text><foreignObject data-role="detail-copy" x="112" y="1000" width="856" height="100"><div xmlns="http://www.w3.org/1999/xhtml" class="ja-sans" style="width:100%;height:100%;display:flex;align-items:center;color:#303948;font-family:&#39;Hiragino Sans&#39;, &#39;Hiragino Kaku Gothic ProN&#39;, &#39;Yu Gothic&#39;, &#39;Noto Sans CJK JP&#39;, &#39;Noto Sans JP&#39;, sans-serif;font-size:23px;font-weight:450;line-height:33px;letter-spacing:0;white-space:normal;line-break:strict;word-break:normal;overflow-wrap:normal;overflow:hidden;">同僚の進捗が早く見えても、担当範囲は人それぞれです。今日終える作業を一つに絞り、手順を決めて取り組んでみてください。</div></foreignObject><rect data-row-key="health" x="72" y="1130" width="936" height="156" rx="14" fill="#ffffff" fill-opacity="0.66" stroke="#20293B" stroke-opacity="0.09" stroke-width="2" filter="url(#panelShadow)"/><text class="ja-sans" data-role="detail-heading" data-row-key="health" x="112" y="1166" fill="#4E9A78" font-size="18" font-weight="800" text-anchor="start">🌿 健康 3/5</text><foreignObject data-role="detail-copy" x="112" y="1176" width="856" height="100"><div xmlns="http://www.w3.org/1999/xhtml" class="ja-sans" style="width:100%;height:100%;display:flex;align-items:center;color:#303948;font-family:&#39;Hiragino Sans&#39;, &#39;Hiragino Kaku Gothic ProN&#39;, &#39;Yu Gothic&#39;, &#39;Noto Sans CJK JP&#39;, &#39;Noto Sans JP&#39;, sans-serif;font-size:23px;font-weight:450;line-height:33px;letter-spacing:0;white-space:normal;line-break:strict;word-break:normal;overflow-wrap:normal;overflow:hidden;">人に合わせた外出が続くと、帰宅後まで気が張りやすくなります。予定のない時間は音を減らし、好きな飲み物で体をゆるめてみてください。</div></foreignObject>

<text class="ja-summary" x="148" y="503" fill="#2A3346" font-size="30" font-weight="400" text-anchor="start">楽しみつつ、購入は候補を持ち帰って比べると安心です</text>
<text class="ja-summary" x="148" y="543" fill="#2A3346" font-size="30" font-weight="400" text-anchor="start">よ。</text>
  <rect data-row-key="love" x="72" y="602" width="936" height="156" rx="14" fill="#ffffff" fill-opacity="0.66" stroke="#20293B" stroke-opacity="0.09" stroke-width="2" filter="url(#panelShadow)"/><text class="ja-sans" data-role="detail-heading" data-row-key="love" x="112" y="638" fill="#C0637A" font-size="18" font-weight="800" text-anchor="start">💗 恋愛 4/5</text><foreignObject data-role="detail-copy" x="112" y="648" width="856" height="100"><div xmlns="http://www.w3.org/1999/xhtml" class="ja-sans" style="width:100%;height:100%;display:flex;align-items:center;color:#303948;font-family:&#39;Hiragino Sans&#39;, &#39;Hiragino Kaku Gothic ProN&#39;, &#39;Yu Gothic&#39;, &#39;Noto Sans CJK JP&#39;, &#39;Noto Sans JP&#39;, sans-serif;font-size:23px;font-weight:450;line-height:33px;letter-spacing:0;white-space:normal;line-break:strict;word-break:normal;overflow-wrap:normal;overflow:hidden;">恋人や気になる人への小さなプレゼントを、予算を決めて選んでみてください。高価さより、相手が以前話していた好みを思い出して品物を決めると喜ばれます。</div></foreignObject><rect data-row-key="money" x="72" y="778" width="936" height="156" rx="14" fill="#ffffff" fill-opacity="0.66" stroke="#20293B" stroke-opacity="0.09" stroke-width="2" filter="url(#panelShadow)"/><text class="ja-sans" data-role="detail-heading" data-row-key="money" x="112" y="814" fill="#B08A3C" font-size="18" font-weight="800" text-anchor="start">💰 金運 4/5</text><foreignObject data-role="detail-copy" x="112" y="824" width="856" height="100"><div xmlns="http://www.w3.org/1999/xhtml" class="ja-sans" style="width:100%;height:100%;display:flex;align-items:center;color:#303948;font-family:&#39;Hiragino Sans&#39;, &#39;Hiragino Kaku Gothic ProN&#39;, &#39;Yu Gothic&#39;, &#39;Noto Sans CJK JP&#39;, &#39;Noto Sans JP&#39;, sans-serif;font-size:23px;font-weight:450;line-height:33px;letter-spacing:0;white-space:normal;line-break:strict;word-break:normal;overflow-wrap:normal;overflow:hidden;">買い物の前に同じ商品の価格を三つの店で比較してみてください。魅力的な広告だけで決めず、送料や保証まで含めた合計額をメモすると納得して選べます。</div></foreignObject><rect data-row-key="career" x="72" y="954" width="936" height="156" rx="14" fill="#ffffff" fill-opacity="0.66" stroke="#20293B" stroke-opacity="0.09" stroke-width="2" filter="url(#panelShadow)"/><text class="ja-sans" data-role="detail-heading" data-row-key="career" x="112" y="990" fill="#4C7A9E" font-size="18" font-weight="800" text-anchor="start">💼 仕事 3/5</text><foreignObject data-role="detail-copy" x="112" y="1000" width="856" height="100"><div xmlns="http://www.w3.org/1999/xhtml" class="ja-sans" style="width:100%;height:100%;display:flex;align-items:center;color:#303948;font-family:&#39;Hiragino Sans&#39;, &#39;Hiragino Kaku Gothic ProN&#39;, &#39;Yu Gothic&#39;, &#39;Noto Sans CJK JP&#39;, &#39;Noto Sans JP&#39;, sans-serif;font-size:23px;font-weight:450;line-height:33px;letter-spacing:0;white-space:normal;line-break:strict;word-break:normal;overflow-wrap:normal;overflow:hidden;">午前の業務開始時に、締め切りと所要時間を一覧にして優先順位をつけてみてください。途中で依頼が増えたら、その場で順番を更新して抱え込みを防ぎましょう。</div></foreignObject><rect data-row-key="health" x="72" y="1130" width="936" height="156" rx="14" fill="#ffffff" fill-opacity="0.66" stroke="#20293B" stroke-opacity="0.09" stroke-width="2" filter="url(#panelShadow)"/><text class="ja-sans" data-role="detail-heading" data-row-key="health" x="112" y="1166" fill="#4E9A78" font-size="18" font-weight="800" text-anchor="start">🌿 健康 4/5</text><foreignObject data-role="detail-copy" x="112" y="1176" width="856" height="100"><div xmlns="http://www.w3.org/1999/xhtml" class="ja-sans" style="width:100%;height:100%;display:flex;align-items:center;color:#303948;font-family:&#39;Hiragino Sans&#39;, &#39;Hiragino Kaku Gothic ProN&#39;, &#39;Yu Gothic&#39;, &#39;Noto Sans CJK JP&#39;, &#39;Noto Sans JP&#39;, sans-serif;font-size:23px;font-weight:450;line-height:33px;letter-spacing:0;white-space:normal;line-break:strict;word-break:normal;overflow-wrap:normal;overflow:hidden;">昼食では主菜に加えてサラダを一皿選び、野菜から食べてみてください。午後に甘い物が欲しくなったら、まず水分を取ってから量を決めると整いやすいでしょう。</div></foreignObject>
